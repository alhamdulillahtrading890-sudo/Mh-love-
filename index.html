<!DOCTYPE html>
<html>
<head>
  <title>MH Love</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg, #ffd6e8, #ffe6f2);
      font-family: Arial;
    }

    .heart{
      position: relative;
      width: 150px;
      height: 150px;
      transform: rotate(-45deg);
      animation: beat 1s infinite, glow 2s infinite;
      filter: drop-shadow(0 0 15px #ff4da6)
              drop-shadow(0 0 25px #ff66b2)
              drop-shadow(0 0 35px #ff99cc);
    }

    .heart,
    .heart::before,
    .heart::after{
      background: #ff4da6;
    }

    .heart::before,
    .heart::after{
      content:"";
      position:absolute;
      width:150px;
      height:150px;
      border-radius:50%;
    }

    .heart::before{
      top:-75px;
      left:0;
    }

    .heart::after{
      left:75px;
      top:0;
    }

    /* 🔼 TOP TEXT */
    .top-text{
      position:absolute;
      top:5px; /* 🔥 একদম উপরের দিকে */
      left:50%;
      transform: translateX(-50%) rotate(45deg);
      font-size:14px;
      color:white;
      font-weight:bold;
      text-shadow:0 0 5px white;
      z-index:10;
    }

    /* 🔤 CENTER TEXT */
    .text{
      position:absolute;
      top:50%;
      left:50%;
      transform: translate(-50%, -80%) rotate(45deg);
      color:white;
      font-size:35px;
      font-weight:bold;
      text-shadow:0 0 10px white;
      z-index:10;
    }

    /* 💌 LOVE TEXT */
    .love-text{
      margin-top:60px;
      font-size:23px;
      color:#ff1a75;
      font-weight:bold;
      animation: fadeUp 3s infinite;
      text-shadow:0 0 8px pink;
    }

    @keyframes beat{
      0%{ transform: rotate(-45deg) scale(1);}
      50%{ transform: rotate(-45deg) scale(1.1);}
      100%{ transform: rotate(-45deg) scale(1);}
    }

    @keyframes glow{
      0%{
        filter: drop-shadow(0 0 10px #ff4da6)
                drop-shadow(0 0 20px #ff66b2)
                drop-shadow(0 0 30px #ff99cc);
      }
      50%{
        filter: drop-shadow(0 0 20px #ff80bf)
                drop-shadow(0 0 40px #ff99cc)
                drop-shadow(0 0 60px #ffcce6);
      }
      100%{
        filter: drop-shadow(0 0 10px #ff4da6)
                drop-shadow(0 0 20px #ff66b2)
                drop-shadow(0 0 30px #ff99cc);
      }
    }

    @keyframes fadeUp{
      0%{opacity:0; transform:translateY(20px);}
      50%{opacity:1; transform:translateY(0);}
      100%{opacity:0; transform:translateY(-20px);}
    }

  </style>
</head>

<body>

<div class="heart">
  <div class="top-text"> love me plz</div>
  <div class="text">Himu</div>
</div>

<div class="love-text">I Love You </div>

</body>
</html>
