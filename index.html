<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift for my Jan</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    "Segoe UI",
    "Segoe UI Emoji",
    "Noto Color Emoji",
    "Apple Color Emoji",
    "Android Emoji",
    sans-serif;
}

body{
    background:#081229;
    overflow:hidden;
}

/* FLOATING HEARTS */

.hearts{
    position:fixed;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
}

.hearts span{
    position:absolute;
    bottom:-100px;
    color:#ff4d88;
    font-size:20px;
    animation:heartMove linear infinite;
}

@keyframes heartMove{

0%{
    transform:translateY(0);
    opacity:0;
}

50%{
    opacity:1;
}

100%{
    transform:translateY(-120vh);
    opacity:0;
}

}

/* LOGIN */

#loginPage{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    z-index:2;
}

.login-box{
    width:90%;
    max-width:380px;
    background:#14204d;
    padding:30px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.login-box h2{
    color:white;
    text-align:center;
    margin-bottom:20px;
    font-size:32px;
}

input{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#22346e;
    color:white;
    font-size:16px;
}

input::placeholder{
    color:#ccc;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:#ff006a;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff3385;
}

#error{
    color:red;
    text-align:center;
    margin-top:15px;
    display:none;
}

/* DASHBOARD */

#dashboard{
    display:none;
    position:relative;
    z-index:2;
    padding:20px;
    min-height:100vh;
}

.top-card{
    background:#14204d;
    padding:25px;
    border-radius:25px;
    text-align:center;
    color:white;
    margin-bottom:25px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.top-card h1{
    font-size:38px;
}

.top-card p{
    margin-top:10px;
    color:#ddd;
    font-size:20px;
}

.logout{
    background:red;
}

/* LOVE TEXT */

.love-text{
    background:#14204d;
    color:white;
    padding:25px;
    border-radius:20px;
    text-align:center;
    font-size:22px;
    line-height:38px;
    margin-top:20px;
    box-shadow:0 0 15px rgba(255,0,106,0.3);
    transition:0.5s;
    animation:glow 2s infinite alternate;
}

@keyframes glow{

from{
    text-shadow:0 0 10px pink;
}

to{
    text-shadow:0 0 25px #ff006a;
}

}

/* MOBILE */

@media(max-width:600px){

.top-card h1{
    font-size:28px;
}

.love-text{
    font-size:18px;
    line-height:32px;
}

}

</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<h2>💖 Love Login 💖</h2>

<input type="password" id="password" placeholder="Password">

<div id="error">
Wrong Password ❌
</div>

<button onclick="login()">
Login 💕
</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard">

<div class="top-card">

<h1>💖 Gift for my Jan Himu 💖</h1>

<p>
Welcome by Maruf 🌸
</p>

<button class="logout" onclick="logout()">
Logout ❤️
</button>

</div>

<div id="loveText" class="love-text"></div>

</div>

<script>

/* LOGIN */

let savedPass = "Himu";

function login(){

let pass =
document.getElementById("password").value;

if(pass === savedPass){

document.getElementById("loginPage").style.display="none";

document.getElementById("dashboard").style.display="block";

}else{

document.getElementById("error").style.display="block";

}

}

/* LOGOUT */

function logout(){

document.getElementById("dashboard").style.display="none";

document.getElementById("loginPage").style.display="flex";

}

loveQuotes.push(
"💖 তুমি আমার হৃদয়ের সবচেয়ে সুন্দর অনুভূতি #" + i
);

}

/* SHOW QUOTES */

let quoteBox =
document.getElementById("loveText");

let currentIndex = 0;

function changeLoveText(){

quoteBox.style.opacity = 0;

setTimeout(()=>{

quoteBox.innerHTML =
loveQuotes[currentIndex];

quoteBox.style.opacity = 1;

currentIndex++;

if(currentIndex >= loveQuotes.length){

currentIndex = 0;

}

},500);

}

/* FIRST LOAD */

changeLoveText();

/* AUTO CHANGE */

setInterval(changeLoveText,5000);

/* FLOATING HEARTS */

let hearts =
document.getElementById("hearts");

function createHeart(){

let heart =
document.createElement("span");

heart.innerHTML = "💖";

heart.style.left =
Math.random() * 100 + "vw";

heart.style.fontSize =
Math.random() * 20 + 20 + "px";

heart.style.animationDuration =
Math.random() * 3 + 3 + "s";

hearts.appendChild(heart);

setTimeout(()=>{

heart.remove();

},6000);

}

setInterval(createHeart,300);
