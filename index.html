<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Night 🌙✨</title>

<!-- EMOJI FONT -->

<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:
    Arial,
    "Noto Color Emoji",
    sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

/* NIGHT SKY */

body{
    position:relative;

    background:
    linear-gradient(
    to top,
    #020111 0%,
    #071b3b 45%,
    #0d3d73 100%
    );
}

/* MOON */

.moon{
    position:absolute;

    top:7%;
    right:8%;

    width:120px;
    height:120px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    #ffffff 0%,
    #dfefff 60%,
    #bdd9ff 100%);

    box-shadow:
    0 0 40px #cfe8ff,
    0 0 80px #8ecbff,
    0 0 150px rgba(173,216,255,0.7);

    animation:moonGlow 4s ease-in-out infinite alternate;

    z-index:2;
}

@keyframes moonGlow{

from{
    transform:scale(1);
}

to{
    transform:scale(1.08);
}

}

/* STARS */

.star{
    position:absolute;

    border-radius:50%;
    background:white;

    animation:
    twinkle 2s infinite alternate;
}

@keyframes twinkle{

from{
    opacity:0.2;
}

to{
    opacity:1;
}

}

/* MOUNTAINS */

.mountain{
    position:absolute;
    bottom:140px;

    width:0;
    height:0;

    border-left:250px solid transparent;
    border-right:250px solid transparent;
    border-bottom:260px solid #07111f;

    z-index:3;
}

.m1{
    left:-150px;
}

.m2{
    left:180px;
    border-bottom-color:#081524;
}

.m3{
    left:520px;
}

.m4{
    left:860px;
    border-bottom-color:#081524;
}

.m5{
    left:1180px;
}

/* FOREST */

.forest{
    position:absolute;

    bottom:110px;

    width:100%;
    height:220px;

    z-index:4;
}

.tree{
    position:absolute;
    bottom:0;

    width:0;
    height:0;

    border-left:22px solid transparent;
    border-right:22px solid transparent;
    border-bottom:90px solid #020b16;
}

/* GROUND */

.ground{
    position:absolute;

    bottom:0;

    width:100%;
    height:160px;

    background:
    linear-gradient(
    to top,
    #050b14,
    #0a1830
    );

    z-index:5;
}

/* MIST */

.mist{
    position:absolute;

    bottom:120px;

    width:220%;
    height:140px;

    background:
    radial-gradient(circle,
    rgba(173,216,230,0.15),
    transparent 70%);

    filter:blur(30px);

    animation:mistMove 18s linear infinite;

    z-index:4;
}

@keyframes mistMove{

0%{
    transform:translateX(0);
}

100%{
    transform:translateX(-50%);
}

}

/* FIREFLIES */

.firefly{
    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#dfff8f;

    box-shadow:
    0 0 10px #dfff8f,
    0 0 20px #dfff8f,
    0 0 35px #dfff8f;

    animation:
    float 6s ease-in-out infinite,
    blink 2s infinite alternate;

    z-index:6;
}

@keyframes float{

0%{
    transform:translateY(0px);
}

50%{
    transform:translateY(-30px);
}

100%{
    transform:translateY(0px);
}

}

@keyframes blink{

from{
    opacity:0.2;
}

to{
    opacity:1;
}

}

/* TEXT */

.text{
    position:absolute;

    bottom:120px;
    width:100%;

    text-align:center;

    z-index:10;
}

.text h1{

    color:white;

    font-size:50px;

    text-shadow:
    0 0 15px #fff,
    0 0 40px #7ec8ff;

    animation:fade 4s ease-in-out infinite;
}

.text p{

    margin-top:18px;

    color:#dbeafe;

    font-size:24px;

    text-shadow:
    0 0 10px rgba(255,255,255,0.6);
}

@keyframes fade{

0%{
    opacity:0.7;
}

50%{
    opacity:1;
}

100%{
    opacity:0.7;
}

}

/* MOBILE */

@media(max-width:768px){

.moon{
    width:85px;
    height:85px;
    top:8%;
    right:8%;
}

.text{
    bottom:100px;
}

.text h1{
    font-size:34px;
}

.text p{
    font-size:18px;
    padding:0 20px;
}

.mountain{
    border-left:180px solid transparent;
    border-right:180px solid transparent;
    border-bottom:180px solid #07111f;
}

.m2{
    left:80px;
}

.m3{
    left:320px;
}

.m4{
    left:520px;
}

}

</style>
</head>
<body>

<!-- MOON -->

<div class="moon"></div>

<!-- STARS -->

<script>

for(let i=0;i<220;i++){

let star =
document.createElement("div");

star.className = "star";

let size =
Math.random()*3 + 1;

star.style.width =
size + "px";

star.style.height =
size + "px";

star.style.left =
Math.random()*100 + "vw";

star.style.top =
Math.random()*80 + "vh";

star.style.animationDuration =
(Math.random()*3 + 1) + "s";

document.body.appendChild(star);

}

</script>

<!-- MOUNTAINS -->

<div class="mountain m1"></div>
<div class="mountain m2"></div>
<div class="mountain m3"></div>
<div class="mountain m4"></div>
<div class="mountain m5"></div>

<!-- FOREST -->

<div class="forest" id="forest"></div>

<!-- MIST -->

<div class="mist"></div>

<!-- GROUND -->

<div class="ground"></div>

<!-- TEXT -->

<div class="text">

<h1>Good Night Janu 🌙</h1>

<p>
You are my moon in every dark night ✨💖
</p>

</div>

<script>

/* TREES */

const forest =
document.getElementById("forest");

for(let i=0;i<55;i++){

let tree =
document.createElement("div");

tree.className = "tree";

tree.style.left =
Math.random()*100 + "vw";

tree.style.transform =
"scale(" + (Math.random()*1.3 + 0.5) + ")";

forest.appendChild(tree);

}

/* FIREFLIES */

for(let i=0;i<70;i++){

let firefly =
document.createElement("div");

firefly.className = "firefly";

firefly.style.left =
Math.random()*100 + "vw";

firefly.style.top =
(Math.random()*45 + 45) + "vh";

firefly.style.animationDuration =
(Math.random()*4 + 3) + "s";

document.body.appendChild(firefly);

}

</script>

</body>
</html>
